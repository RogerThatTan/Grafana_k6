name: Performance Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-performance-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-performance-web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build -- tests/smoke/login.smoke.ts
      - uses: grafana/setup-k6-action@v1
      - run: k6 run dist/login.smoke.js
        env:
          BASE_URL: ${{ vars.PERFORMANCE_BASE_URL }}
